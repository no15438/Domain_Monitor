services:
  - type: web
    name: domain-monitor-backend-no15438
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: LLM_PROVIDER
        value: openai_compat
      - key: OPENAI_COMPAT_BASE_URL
        value: https://llm.ichonhui.com/qwen35-27b-fp8/v1
      - key: OPENAI_COMPAT_MODEL
        value: qwen35-35b-fp8
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_MODEL
        value: qwen3.5-flash
      - key: DASHSCOPE_BASE_URL
        value: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      - key: TAVILY_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: EVENT_REGISTRY_API_KEY
        sync: false
      - key: GLOBAL_RSS_FEEDS
        value: ""
      - key: TAVILY_EXCLUDE_DOMAINS
        value: wikipedia.org,baike.baidu.com,baidu.com,wikiwand.com,britannica.com,zhihu.com
      - key: MONITOR_KEYWORDS
        value: artificial intelligence,machine learning
      - key: FETCH_INTERVAL_MINUTES
        value: "15"
      - key: MAX_RESULTS_PER_KEYWORD
        value: "3"
      - key: DATABASE_PATH
        value: /tmp/domain-monitor/monitor.db
      - key: CHROMA_PERSIST_DIR
        value: /tmp/domain-monitor/chroma
      - key: CORS_ORIGINS
        value: https://domain-monitor-frontend-no15438.onrender.com,http://localhost:3000
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: domain-monitor-frontend-no15438
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: Dockerfile
    healthCheckPath: /
    dockerCommand: /bin/sh -c "PORT=10000 HOSTNAME=0.0.0.0 node server.js"
    envVars:
      - key: INTERNAL_API_BASE
        value: https://domain-monitor-backend-no15438.onrender.com
      - key: NEXT_PUBLIC_API_BASE
        value: ""
