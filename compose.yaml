services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_PATH: /app/data/monitor.db
      CHROMA_PERSIST_DIR: /app/data/chroma
      EVENT_MEMORY_DATABASE_PATH: /app/data/eventkb.sqlite3
      EVENT_MEMORY_ENABLED: "true"
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        INTERNAL_API_BASE: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  backend_data:
