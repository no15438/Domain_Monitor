services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_PATH: /app/data/monitor.db
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        INTERNAL_API_BASE: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  backend_data:
