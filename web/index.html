<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domain Monitor · 事件记忆实验室</title>
<style>
:root{color-scheme:light;font:15px/1.6 system-ui,sans-serif;color:#173438;background:#f3f6f4}*{box-sizing:border-box}body{max-width:1280px;margin:0 auto;padding:36px 24px}h1{font-size:32px;margin:0}header{border-bottom:1px solid #cbd8d2;padding-bottom:24px}small,.muted{color:#526d67}label{display:block;font-size:13px}input,select,button{font:inherit;padding:9px 12px;border:1px solid #b8cbc2;border-radius:6px;background:white;color:inherit}button{cursor:pointer;background:#174f48;color:white}button.secondary{background:#e6eeea;color:#174f48}form.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:24px 0}input[type=checkbox]{width:auto}main{display:grid;grid-template-columns:300px 1fr;gap:24px}aside button{display:block;width:100%;text-align:left;margin-bottom:10px;background:white;color:#173438}aside button.selected{border:2px solid #174f48}.panel{padding:24px;border:1px solid #d4dfda;border-radius:10px;background:white;min-width:0}h2{margin-top:0}dl{display:grid;grid-template-columns:130px 1fr;gap:12px}dt{color:#526d67}dd{margin:0;overflow-wrap:anywhere}.conflict{color:#a43d26;font-weight:bold}.badge{background:#e8f0e8;border-radius:4px;padding:3px 7px;font-size:12px}details{margin-top:20px}pre{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f4;padding:16px;border-radius:6px;max-height:520px;overflow:auto}.policy{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:25px;border-top:1px solid #d4dfda;padding-top:20px}.policy input[type=number]{width:100px}#error{color:#a43d26}a{color:#174f48}@media(max-width:750px){main{grid-template-columns:1fr}dl{grid-template-columns:100px 1fr}}
</style>
<header><small>DOMAIN MONITOR / PHASE 01 · OFFLINE</small><h1>事件记忆实验室</h1><p>一个事件，一条完整演化历程。当前事实由有效时间与获知时间共同决定。</p><span class="badge">合成数据 · SQLite 事实权威 · 无模型调用</span></header>
<form class="filters" id="filters"><label>检索当前字段<input name="q" placeholder="例如 completed 或 上海"></label><label>事实在何时有效<input name="valid" type="datetime-local"></label><label>截至何时已知<input name="known" type="datetime-local"></label><label><input name="archive" type="checkbox"> 包含可恢复归档</label><button>查询</button><button type="button" id="resetFilters" class="secondary">回到现在</button></form>
<p id="error" role="alert"></p><main><aside id="events" aria-label="事件列表"></aside><section id="detail" class="panel"><h2>选择事件</h2><p>先运行 <code>python3 -m eventkb demo</code> 生成示例。</p></section></main>
<script>
const $=s=>document.querySelector(s);let selected=null,current=null,request=0;
const make=(tag,text,cls)=>{const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el};
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);const data=await r.json();if(!r.ok)throw Error(data.error||r.status);return data}
function query(){const f=new FormData($('#filters'));const q=new URLSearchParams({q:f.get('q')||'',include_archived:f.has('archive')?'true':'false'});for(const [name,param]of [['valid','valid_at'],['known','known_at']])if(f.get(name))q.set(param,new Date(f.get(name)).toISOString());return q}
async function load(){const turn=++request;$('#error').textContent='';try{const q=query();const items=await api('/api/events?'+q);if(turn!==request)return;$('#events').replaceChildren();for(const item of items){const b=make('button');b.append(make('strong',item.event.title),make('div',`${item.memory.mode} · 重要性 ${item.memory.importance}${item.has_conflicts?' · 存在冲突':''}`));b.classList.toggle('selected',selected===item.event.id);b.onclick=()=>{selected=item.event.id;load()};$('#events').append(b)}if(!items.length){$('#events').textContent='无匹配事件';$('#detail').replaceChildren(make('h2','无匹配事件'));return}current=items.find(x=>x.event.id===selected)||items[0];selected=current.event.id;const history=await api('/api/events/'+encodeURIComponent(selected)+'/history?'+q);if(turn!==request)return;render(current,history)}catch(e){if(turn===request)$('#error').textContent=e.message}}
function render(item,history){const box=$('#detail');box.replaceChildren(make('h2',item.event.title));box.append(make('p',`${item.event.id} · ${item.event.kind} · topic: ${item.event.topic}`,'muted'));box.append(make('p',`有效时间 ${item.valid_at} ／ 获知截止 ${item.known_at}`,'muted'));const dl=make('dl');for(const [key,fact]of Object.entries(item.fields)){dl.append(make('dt',key));const dd=make('dd');dd.append(make('div',fact.status==='conflict'?'未解决冲突：尚无确定值':JSON.stringify(fact.value),fact.status==='conflict'?'conflict':''));dd.append(make('small',`证据：${fact.evidence_ids.join(', ')}`));if(fact.status==='conflict')dd.append(make('pre',JSON.stringify(fact.alternatives,null,2)));dl.append(dd)}box.append(dl);if(!Object.keys(item.fields).length)box.append(make('p','该有效时间没有已知字段。'));const details=make('details');details.append(make('summary',`完整演化与来源版本（${history.assertions.length} 条断言 / ${history.evidence.length} 份证据）`),make('pre',JSON.stringify(history,null,2)));box.append(details);
const form=make('form',undefined,'policy');const input=make('input');input.type='number';input.min=0;input.max=1;input.step=.05;input.value=item.memory.importance;input.setAttribute('aria-label','重要性');const mode=make('select');mode.setAttribute('aria-label','记忆层级');for(const [v,t]of [['active','工作记忆'],['summary','摘要降权'],['archived','可恢复归档']]){const o=make('option',t);o.value=v;mode.append(o)}mode.value=item.memory.mode;const reason=make('input');reason.placeholder='调整原因（必填）';reason.required=true;reason.setAttribute('aria-label','调整原因');const pin=make('input');pin.type='checkbox';pin.checked=!!item.memory.pinned;const label=make('label','置顶');label.prepend(pin);const save=make('button','保存记忆策略');form.append(input,mode,label,reason,save);form.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{await api('/api/events/'+encodeURIComponent(item.event.id)+'/memory',{importance:Number(input.value),mode:mode.value,pinned:pin.checked,reason:reason.value});await load()}catch(err){$('#error').textContent=err.message}finally{save.disabled=false}};box.append(form,make('small','归档只影响默认检索；勾选“包含可恢复归档”后可将层级改回工作记忆。修改策略后重新运行 memory 命令生成索引。'))}
$('#filters').onsubmit=e=>{e.preventDefault();load()};$('#resetFilters').onclick=()=>{$('#filters').reset();load()};load();
</script></html>
